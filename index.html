th: 600px; margin: 0 auto; padding: 16px; flex: 1; width: 100%; }\n\n  .workout-content, .page-content { display: none; }\n  .workout-content.active, .page-content.active { display: block; }\n\n  .ex {\n    background: #161b22; border: 1px solid #30363d; border-radius: 12px;\n    padding: 14px; margin-bottom: 12px;\n  }\n  .ex h3 { font-size: 1rem; color: #f0f6fc; margin-bottom: 2px; }\n  .meta { color: #8b949e; font-size: .78rem; margin-bottom: 8px; }\n  .tip { color: #d2a8ff; font-size: .78rem; font-style: italic; margin-bottom: 12px; }\n\n  .sets-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }\n  .set-btn {\n    background: #21262d; border: 1px solid #30363d; color: #c9d1d9;\n    padding: 10px 4px; border-radius: 6px; font-size: .8rem; cursor: pointer;\n    font-weight: 500; text-align: center; transition: all 0.2s;\n  }\n  .set-btn.done { background: #238636; border-color: #2ea043; color: #fff; }\n\n  /* الإضافات الخاصة بالتقدم */\n  .daily-progress-container {\n    background: #161b22; border: 1px solid #30363d; border-radius: 12px;\n    padding: 12px; margin-bottom: 16px;\n  }\n  .progress-bar-bg { background: #21262d; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 6px; }\n  .progress-bar-fill { background: #238636; height: 100%; width: 0%; transition: width 0.3s ease; }\n\n  .save-btn-wrap { margin-top: 16px; text-align: center; }\n  .save-btn {\n    background: #1f6feb; color: #fff; border: none; border-radius: 8px;\n    padding: 12px 20px; font-size: .88rem; font-weight: bold; cursor: pointer;\n  }\n  .reset-btn {\n    background: #21262d; color: #f85149; border: 1px solid #30363d; border-radius: 8px;\n    padding: 12px 16px; font-size: .88rem; font-weight: bold; cursor: pointer; margin-right: 8px;\n  }\n  .save-note { color: #3fb950; font-size: .85rem; margin-top: 10px; text-align: center; font-weight: bold; }\n\n  .progress-card {\n    background: #161b22; border: 1px solid #30363d; border-radius: 12px;\n    padding: 16px; margin-bottom: 14px;\n  }\n  .progress-card h2 { font-size: 1.1rem; color: #58a6ff; margin-bottom: 16px; }\n  \n  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }\n  .stat-box { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 14px 6px; text-align: center; }\n  .stat-val { font-size: 1.4rem; font-weight: bold; color: #58a6ff; }\n  .stat-lbl { font-size: .72rem; color: #8b949e; margin-top: 4px; }\n\n  .history-list { display: flex; flex-direction: column; gap: 10px; }\n  .history-item {\n    background: #0d1117; border: 1px solid #30363d; border-radius: 8px;\n    padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;\n  }\n  .history-title { font-size: .88rem; color: #f0f6fc; }\n  .history-pct { font-size: .9rem; font-weight: bold; color: #3fb950; }\n\n  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; margin-bottom: 12px; }\n  .card h2 { font-size: 1.05rem; color: #58a6ff; margin-bottom: 10px; }\n  .card h3.sub { font-size: .9rem; color: #f0f6fc; margin: 14px 0 6px; }\n  .card p, .card li { font-size: .82rem; color: #c9d1d9; line-height: 1.7; }\n  .card ul { padding-right: 18px; margin-bottom: 6px; }\n\n  .contact-box {\n    background: #0d1117; border: 1px solid #1f6feb; border-radius: 8px;\n    padding: 12px; margin-top: 14px; text-align: center; color: #58a6ff; font-size: .85rem; line-height: 1.6;\n  }\n  .contact-box a { color: #58a6ff; text-decoration: none; font-weight: bold; }\n\n  footer {\n    background: #161b22; border-top: 1px solid #30363d;\n    padding: 16px; text-align: center; font-size: .78rem; color: #8b949e; margin-top: auto;\n  }\n<\/style>\n<\/head>\n<body>\n\n<header>\n  <h1>🏋️‍♂️ برنامج التضخيم العضلي المكثف<\/h1>\n  <p>4 أيام في الأسبوع - تركيز على الحجم والأوزان<\/p>\n  <div class=\"owner-badge\">👑 إعداد وتطوير: أحمد سرحان حامد عبد العاطي<\/div>\n<\/header>\n\n<div class=\"tabs\">\n  <button class=\"tab active\" onclick=\"switchTab('day1', this)\">💪 اليوم 1: صدر وباي<\/button>\n  <button class=\"tab\" onclick=\"switchTab('day2', this)\">🔥 اليوم 2: ظهر وتراي<\/button>\n  <button class=\"tab\" onclick=\"switchTab('day3', this)\">⚡ اليوم 3: أكتاف<\/button>\n  <button class=\"tab\" onclick=\"switchTab('day4', this)\">🦵 اليوم 4: أرجل<\/button>\n  <button class=\"tab\" onclick=\"switchTab('progress', this)\">📊 التقدم<\/button>\n  <button class=\"tab\" onclick=\"switchTab('nutrition', this)\">🥗 التغذية<\/button>\n<\/div>\n\n<main>\n  <div id=\"days-container\"><\/div>\n\n  <!-- Progress Tab -->\n  <div id=\"progress\" class=\"page-content\">\n    <div class=\"progress-card\">\n      <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;\">\n        <h2>📈 سجل إنجازاتك وتقدرك<\/h2>\n        <button onclick=\"clearHistory()\" style=\"background:none; border:none; color:#f85149; font-size:.75rem; cursor:pointer;\">مسح السجل<\/button>\n      <\/div>\n      \n      <div class=\"stats-grid\">\n        <div class=\"stat-box\">\n          <div class=\"stat-val\" id=\"stat-sessions\">0<\/div>\n          <div class=\"stat-lbl\">جلسات مسجلة<\/div>\n        <\/div>\n        <div class=\"stat-box\">\n          <div class=\"stat-val\" id=\"stat-streak\">0<\/div>\n          <div class=\"stat-lbl\">أيام مكتملة<\/div>\n        <\/div>\n        <div class=\"stat-box\">\n          <div class=\"stat-val\" id=\"stat-avg\">0%<\/div>\n          <div class=\"stat-lbl\">متوسط الإنجاز<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"history-list\" id=\"history-container\"><\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Nutrition Tab -->\n  <div id=\"nutrition\" class=\"page-content\">\n    <div class=\"card\">\n      <h2>💡 دليل التغذية للتضخيم<\/h2>\n      <p>التضخيم يقتضي استهلاك سعرات حرارية أكثر من احتياجك اليومي لبناء العضلات.<\/p>\n      \n      <h3 class=\"sub\">🥩 البروتين المطلوب<\/h3>\n      <p>1.6 - 2.2 جرام لكل كجم من وزن جسمك يومياً.<\/p>\n\n      <h3 class=\"sub\">🍚 أفضل المصادر<\/h3>\n      <ul>\n        <li>صدور دجاج، لحوم حمراء، بيض، أسماك<\/li>\n        <li>أرز، شوفان، بطاطا، موز، مكسرات<\/li>\n      <\/ul>\n\n      <div class=\"contact-box\">\n        📞 للاستشارات المخصصة والمتابعة الغذائية التواصل مع:<br>\n        <strong>أخصائي التغذية / أحمد سرحان حامد عبد العاطي<\/strong><br>\n        هاتف / واتساب: <a href=\"tel:01033186879\">01033186879<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/main>\n\n<footer>\n  جميع الحقوق محفوظة © <strong>أحمد سرحان حامد عبد العاطي<\/strong> | <a href=\"tel:01033186879\" style=\"color: #8b949e; text-decoration: underline;\">01033186879<\/a>\n<\/footer>\n\n<script>\nvar workoutData = {\n  day1: {\n    label: \"💪 اليوم 1: صدر وباي\",\n    exercises: [\n      { name: \"بنش برس بالبار (Bench Press)\", meta: \"4 مجموعات × 8-10 تكرارات | الراحة: 90 ثانية\", tip: \"ركز على النزول البطيء والدفع الانفجاري.\", sets: 4 },\n      { name: \"بنش برس مائل بالدمبل (Incline DB Press)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 75 ثانية\", tip: \"يستهدف الجزء العلوي من الصدر.\", sets: 3 },\n      { name: \"كروس أوفر بالكابل (Cable Crossover)\", meta: \"3 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"اعصر الصدر في نهاية الحركة.\", sets: 3 },\n      { name: \"تبادل بايسبس بالدمبلز (Bicep Curls)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 60 ثانية\", tip: \"اعزل العضلة وتجنب أرجحة الجسد.\", sets: 3 },\n      { name: \"هامر كيرل (Hammer Curl)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 60 ثانية\", tip: \"يستهدف العضلة العضدية الجانبية.\", sets: 3 }\n    ]\n  },\n  day2: {\n    label: \"🔥 اليوم 2: ظهر وتراي\",\n    exercises: [\n      { name: \"سحب ظهر علوي (Lat Pulldown)\", meta: \"4 مجموعات × 10 تكرارات | الراحة: 90 ثانية\", tip: \"اسحب لأسفل بمرفقين مش بإيدين بس.\", sets: 4 },\n      { name: \"تجديف بالبار (Barbell Row)\", meta: \"4 مجموعات × 8-10 تكرارات | الراحة: 90 ثانية\", tip: \"حافظ على استقامة الظهر طول الحركة.\", sets: 4 },\n      { name: \"تجديف كابل جالس (Seated Cable Row)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 75 ثانية\", tip: \"اعصر لوح الكتف عند نهاية السحب.\", sets: 3 },\n      { name: \"دفع تراي بالكابل (Tricep Pushdown)\", meta: \"3 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"ثبّت المرفقين بجانب الجسم.\", sets: 3 },\n      { name: \"سكال كراشر (Skull Crusher)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 60 ثانية\", tip: \"تحكم في النزول لتجنب إصابة الكوع.\", sets: 3 }\n    ]\n  },\n  day3: {\n    label: \"⚡ اليوم 3: أكتاف\",\n    exercises: [\n      { name: \"ضغط أكتاف بالدمبل (Overhead Press)\", meta: \"4 مجموعات × 8-10 تكرارات | الراحة: 90 ثانية\", tip: \"تجنب القوس الزائد في أسفل الظهر.\", sets: 4 },\n      { name: \"رفرفة جانبية (Lateral Raise)\", meta: \"4 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"ارفع لمستوى الكتف مش أعلى.\", sets: 4 },\n      { name: \"رفرفة خلفية (Rear Delt Fly)\", meta: \"3 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"يستهدف الجزء الخلفي من الكتف.\", sets: 3 },\n      { name: \"شراج بالبار (Barbell Shrug)\", meta: \"3 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"ارفع الكتفين لفوق مباشرة من غير لف.\", sets: 3 }\n    ]\n  },\n  day4: {\n    label: \"🦵 اليوم 4: أرجل\",\n    exercises: [\n      { name: \"سكوات بالبار (Barbell Squat)\", meta: \"4 مجموعات × 8-10 تكرارات | الراحة: 120 ثانية\", tip: \"الركبة في اتجاه أصابع القدم طول الحركة.\", sets: 4 },\n      { name: \"ليج برس (Leg Press)\", meta: \"4 مجموعات × 10-12 تكرار | الراحة: 90 ثانية\", tip: \"متفتحش الركبة بالكامل في القمة.\", sets: 4 },\n      { name: \"رومانيان ديدليفت (Romanian Deadlift)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 90 ثانية\", tip: \"حس بشد الهامسترنج مش الظهر.\", sets: 3 },\n      { name: \"ليج كيرل (Leg Curl)\", meta: \"3 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"حركة بطيئة ومتحكم فيها.\", sets: 3 },\n      { name: \"رفع أصابع القدم (Calf Raise)\", meta: \"4 مجموعات × 15-20 تكرار | الراحة: 45 ثانية\", tip: \"وقف لحظة في أعلى الحركة.\", sets: 4 }\n    ]\n  }\n};\n\nfunction renderDays() {\n  var container = document.getElementById('days-container');\n  if (!container) return;\n  container.innerHTML = '';\n\n  Object.keys(workoutData).forEach(function(dayId) {\n    var day = workoutData[dayId];\n    var div = document.createElement('div');\n    div.id = dayId;\n    div.className = 'workout-content' + (dayId === 'day1' ? ' active' : '');\n\n    var savedState = localStorage.getItem('workout_progress_' + dayId);\n    var activeSets = savedState ? JSON.parse(savedState) : [];\n\n    var progressHeader = document.createElement('div');\n    progressHeader.className = 'daily-progress-container';\n    progressHeader.innerHTML = '<div style=\"display:flex; justify-content:space-between; font-size:.85rem;\">' +\n      '<span>مستوى إنجاز تمرين اليوم:<\/span><strong id=\"pct-text-' + dayId + '\">0%<\/strong><\/div>' +\n      '<div class=\"progress-bar-bg\"><div class=\"progress-bar-fill\" id=\"bar-fill-' + dayId + '\"><\/div><\/div>';\n    div.appendChild(progressHeader);\n\n    day.exercises.forEach(function(ex, exIdx) {\n      var exDiv = document.createElement('div');\n      exDiv.className = 'ex';\n      var setsHtml = '';\n      for (var s = 0; s < ex.sets; s++) {\n        var isDone = activeSets.indexOf(exIdx + '-' + s) !== -1;\n        setsHtml += '<button class=\"set-btn ' + (isDone ? 'done' : '') + '\" data-day=\"' + dayId + '\" data-ex=\"' + exIdx + '\" data-set=\"' + s + '\" onclick=\"toggleSet(this)\">جولة ' + (s + 1) + '<\/button>';\n      }\n      exDiv.innerHTML = '<h3>' + ex.name + '<\/h3>' +\n        '<div class=\"meta\">' + ex.meta + '<\/div>' +\n        '<div class=\"tip\">💡 ملاحظة: ' + ex.tip + '<\/div>' +\n        '<div class=\"sets-grid\">' + setsHtml + '<\/div>';\n      div.appendChild(exDiv);\n    });\n\n    var saveWrap = document.createElement('div');\n    saveWrap.className = 'save-btn-wrap';\n    saveWrap.innerHTML = '<button class=\"save-btn\" onclick=\"saveSession(\\'' + dayId + '\\')\">💾 حفظ الجلسة في التقدم<\/button> ' +\n      '<button class=\"reset-btn\" onclick=\"resetDayProgress(\\'' + dayId + '\\')\">🔄 إعادة ضبط اليوم<\/button>' +\n      '<div class=\"save-note\" id=\"save-note-' + dayId + '\"><\/div>';\n    div.appendChild(saveWrap);\n\n    container.appendChild(div);\n    updateDailyProgressBar(dayId);\n  });\n}\n\nfunction switchTab(targetId, btn) {\n  var contents = document.querySelectorAll('.workout-content, .page-content');\n  for (var i = 0; i < contents.length; i++) contents[i].classList.remove('active');\n  \n  var tabs = document.querySelectorAll('.tab');\n  for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove('active');\n  \n  var targetEl = document.getElementById(targetId);\n  if (targetEl) targetEl.classList.add('active');\n  if (btn) btn.classList.add('active');\n\n  if (targetId === 'progress') {\n    renderProgressStats();\n  }\n}\n\nfunction toggleSet(btn) {\n  btn.classList.toggle('done');\n  var dayId = btn.getAttribute('data-day');\n  saveCurrentState(dayId);\n  updateDailyProgressBar(dayId);\n}\n\nfunction saveCurrentState(dayId) {\n  var activeDay = document.getElementById(dayId);\n  if (!activeDay) return;\n  var doneButtons = activeDay.querySelectorAll('.set-btn.done');\n  var doneIndices = [];\n  for (var i = 0; i < doneButtons.length; i++) {\n    doneIndices.push(doneButtons[i].getAttribute('data-ex') + '-' + doneButtons[i].getAttribute('data-set'));\n  }\n  localStorage.setItem('workout_progress_' + dayId, JSON.stringify(doneIndices));\n}\n\nfunction updateDailyProgressBar(dayId) {\n  var day = workoutData[dayId];\n  if (!day) return;\n  var totalSets = 0;\n  day.exercises.forEach(function(e) { totalSets += e.sets; });\n\n  var activeDay = document.getElementById(dayId);\n  var doneSets = activeDay ? activeDay.querySelectorAll('.set-btn.done').length : 0;\n  var pct = Math.round((doneSets / totalSets) * 100);\n\n  var txt = document.getElementById('pct-text-' + dayId);\n  var bar = document.getElementById('bar-fill-' + dayId);\n  if (txt) txt.innerText = pct + '%';\n  if (bar) bar.style.width = pct + '%';\n}\n\nfunction saveSession(dayId) {\n  saveCurrentState(dayId);\n  \n  var day = workoutData[dayId];\n  var totalSets = 0;\n  day.exercises.forEach(function(e) { totalSets += e.sets; });\n\n  var activeDay = document.getElementById(dayId);\n  var doneSets = activeDay ? activeDay.querySelectorAll('.set-btn.done').length : 0;\n  var pct = Math.round((doneSets / totalSets) * 100);\n\n  var today = new Date().toISOString().split('T')[0];\n  var historyStr = localStorage.getItem('workout_history');\n  var history = historyStr ? JSON.parse(historyStr) : [];\n  \n  history = history.filter(function(h) { return !(h.date === today && h.dayId === dayId); });\n  \n  history.unshift({\n    date: today,\n    dayId: dayId,\n    label: day.label,\n    pct: pct\n  });\n\n  localStorage.setItem('workout_history', JSON.stringify(history));\n\n  var note = document.getElementById('save-note-' + dayId);\n  if (note) {\n    note.innerText = '✅ تم حفظ الجلسة بنجاح بنسبة ' + pct + '%!';\n    setTimeout(function() { note.innerText = ''; }, 3000);\n  }\n}\n\nfunction resetDayProgress(dayId) {\n  if (confirm('هل أنت تأكد من إعادة ضبط تمارين هذا اليوم؟')) {\n    localStorage.setItem('workout_progress_' + dayId, JSON.stringify([]));\n    var activeDay = document.getElementById(dayId);\n    if (activeDay) {\n      var btns = activeDay.querySelectorAll('.set-btn');\n      for (var i = 0; i < btns.length; i++) btns[i].classList.remove('done');\n    }\n    updateDailyProgressBar(dayId);\n    var note = document.getElementById('save-note-' + dayId);\n    if (note) {\n      note.innerText = '🔄 تم إعادة الضبط.';\n      setTimeout(function() { note.innerText = ''; }, 2000);\n    }\n  }\n}\n\nfunction renderProgressStats() {\n  var historyStr = localStorage.getItem('workout_history');\n  var history = historyStr ? JSON.parse(historyStr) : [];\n  \n  var statSessions = document.getElementById('stat-sessions');\n  var statAvg = document.getElementById('stat-avg');\n  var statStreak = document.getElementById('stat-streak');\n  var historyContainer = document.getElementById('history-container');\n\n  if (statSessions) statSessions.innerText = history.length;\n  \n  if (history.length > 0) {\n    var totalPct = 0;\n    var completedDays = 0;\n    for (var i = 0; i < history.length; i++) {\n      totalPct += history[i].pct;\n      if (history[i].pct === 100) completedDays++;\n    }\n    var avg = Math.round(totalPct / history.length);\n    if (statAvg) statAvg.innerText = avg + '%';\n    if (statStreak) statStreak.innerText = completedDays;\n  } else {\n    if (statAvg) statAvg.innerText = '0%';\n    if (statStreak) statStreak.innerText = '0';\n  }\n\n  if (historyContainer) {\n    if (history.length === 0) {\n      historyContainer.innerHTML = '<div style=\"text-align:center; color:#8b949e; padding:15px;\">لا توجد جلسات مسجلة بعد. اضغط \"حفظ الجلسة في التقدم\" بعد إكمال التمرين!<\/div>';\n    } else {\n      var html = '';\n      for (var j = 0; j < history.length; j++) {\n        html += '<div class=\"history-item\">' +\n          '<div class=\"history-title\">' + history[j].date + ' - ' + history[j].label + '<\/div>' +\n          '<div class=\"history-pct\">' + history[j].pct + '%<\/div>' +\n          '<\/div>';\n      }\n      historyContainer.innerHTML = html;\n    }\n  }\n}\n\nfunction clearHistory() {\n  if (confirm('هل ترغب في حذف سجل الجلسات المحفوظة بالكامل؟')) {\n    localStorage.removeItem('workout_history');\n    renderProgressStats();\n  }\n}\n\nfunction initApp() {\n  renderDays();\n  renderProgressStats();\n}\n\nif (document.readyState === 'loading') {\n  document.addEventListener('DOMContentLoaded', initApp);\n} else {\n  initApp();\n}\n<\/script>\n<\/body>\n<\/html>\n", "2": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<link rel=\"icon\" href=\"data:image/jpeg;base64,/9j/4QE3RXhpZgAATU0AKgAAAAgABgEAAAQAAAABAAAAsQEBAAQAAAABAAAAqIdpAAQAAAABAAA order:1px solid #1f6feb;border-radius:8px;padding:12px;margin-top:14px;text-align:center;color:#58a6ff;font-size:.85rem;line-height:1.6}\n.contact-box a{color:#58a6ff;text-decoration:none;font-weight:bold}\nfooter{background:#161b22;border-top:1px solid #30363d;padding:16px;text-align:center;font-size:.78rem;color:#8b949e;margin-top:auto}\nfooter strong{color:#c9d1d9}\n<\/style>\n<\/head>\n<body>\n\n<header>\n  <h1>🏋️‍♂️ برنامج التضخيم العضلي المكثف<\/h1>\n  <p>4 أيام في الأسبوع - تركيز على الحجم والأوزان<\/p>\n  <div class=\"owner-badge\">👑 إعداد وتطوير: أحمد سرحان حامد عبد العاطي<\/div><br>\n  <button class=\"admin-btn\" id=\"adminBtn\" onclick=\"toggleAdmin()\">⚙️ وضع المدير<\/button>\n<\/header>\n\n<div class=\"tabs\">\n  <button class=\"tab active\" onclick=\"switchTab('day1',this)\">💪 اليوم 1: صدر وباي<\/button>\n  <button class=\"tab\" onclick=\"switchTab('day2',this)\">🔥 اليوم 2: ظهر وتراي<\/button>\n  <button class=\"tab\" onclick=\"switchTab('day3',this)\">⚡ اليوم 3: أكتاف<\/button>\n  <button class=\"tab\" onclick=\"switchTab('day4',this)\">🦵 اليوم 4: أرجل<\/button>\n  <button class=\"tab\" onclick=\"switchTab('progress',this)\">📊 التقدم<\/button>\n  <button class=\"tab\" onclick=\"switchTab('nutrition',this)\">🥗 التغذية<\/button>\n<\/div>\n\n<main>\n  <div id=\"days-container\"><\/div>\n\n  <div id=\"progress\" class=\"page-content\">\n    <div class=\"progress-card\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:16px\">\n        <h2>📈 سجل إنجازاتك وتقدمك<\/h2>\n        <button onclick=\"clearHistory()\" style=\"background:none;border:none;color:#f85149;font-size:.75rem;cursor:pointer\">مسح السجل<\/button>\n      <\/div>\n      <div class=\"stats-grid\">\n        <div class=\"stat-box\"><div class=\"stat-val\" id=\"stat-sessions\">0<\/div><div class=\"stat-lbl\">جلسات مسجلة<\/div><\/div>\n        <div class=\"stat-box\"><div class=\"stat-val\" id=\"stat-streak\">0<\/div><div class=\"stat-lbl\">أيام مكتملة<\/div><\/div>\n        <div class=\"stat-box\"><div class=\"stat-val\" id=\"stat-avg\">0%<\/div><div class=\"stat-lbl\">متوسط الإنجاز<\/div><\/div>\n      <\/div>\n      <div class=\"history-list\" id=\"history-container\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"nutrition\" class=\"page-content\">\n    <div class=\"card\">\n      <h2>📊 حاسبة التغذية ومولد نظام التضخيم<\/h2>\n      <p>أدخل بياناتك لحساب الاحتياج اليومي من السعرات والماكروز واستخراج اقتراح وجبات مخصص.<\/p>\n      <div class=\"diet-form\">\n        <div class=\"form-group\"><label>السن (سنة)<\/label><input type=\"number\" id=\"age\" placeholder=\"مثال: 25\" min=\"12\" max=\"80\"><\/div>\n        <div class=\"form-group\"><label>الوزن (كجم)<\/label><input type=\"number\" id=\"weight\" placeholder=\"مثال: 75\" min=\"30\" max=\"200\"><\/div>\n        <div class=\"form-group\"><label>الطول (سم)<\/label><input type=\"number\" id=\"height\" placeholder=\"مثال: 175\" min=\"100\" max=\"230\"><\/div>\n        <div class=\"form-group\"><label>النوع<\/label><select id=\"gender\"><option value=\"male\">ذكر<\/option><option value=\"female\">أنثى<\/option><\/select><\/div>\n        <div class=\"form-group full\"><label>مستوى النشاط البدني<\/label>\n          <select id=\"activity\">\n            <option value=\"1.375\">خفيف إلى متوسط (3-4 أيام تمرين)<\/option>\n            <option value=\"1.55\" selected>عالي (4-5 أيام تمرين مكثف)<\/option>\n            <option value=\"1.725\">رياضي قوي (6 أيام تمرين مكثف)<\/option>\n          <\/select>\n        <\/div>\n        <button class=\"calc-btn\" onclick=\"generateDietPlan()\">🧮 تصميم النظام الغذائي<\/button>\n      <\/div>\n      <div id=\"diet-result\" class=\"diet-result\">\n        <h4>🎯 النتائج المستهدفة لتضخيم نظيف:<\/h4>\n        <div class=\"macro-grid\">\n          <div class=\"macro-box\"><div class=\"val\" id=\"res-cals\">0<\/div><div class=\"lbl\">سعرة / يوم<\/div><\/div>\n          <div class=\"macro-box\"><div class=\"val\" id=\"res-protein\">0g<\/div><div class=\"lbl\">بروتين<\/div><\/div>\n          <div class=\"macro-box\"><div class=\"val\" id=\"res-carbs\">0g<\/div><div class=\"lbl\">كاربوهيدرات<\/div><\/div>\n        <\/div>\n        <div style=\"text-align:center;margin-bottom:10px\">\n          <small style=\"color:#8b949e\">الدهون الصحية المطلوبة: <strong id=\"res-fats\" style=\"color:#d2a8ff\">0g<\/strong> يومياً<\/small>\n        <\/div>\n        <h3 class=\"sub\">🍽️ مقترح توزيع الوجبات اليومي:<\/h3>\n        <ul id=\"meal-plan-list\"><\/ul>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>🥗 أساسيات التغذية لمرحلة التضخيم<\/h2>\n      <p>عشان تكسب عضل بجودة عالية من غير دهون زيادة كتير، ركّز على 3 محاور: فائض سعرات معتدل، بروتين كافي، وانتظام في المواعيد.<\/p>\n      <h3 class=\"sub\">توزيع تقريبي للماكروز (لكل كيلوجرام من وزن الجسم)<\/h3>\n      <div class=\"macro-grid\">\n        <div class=\"macro-box\"><div class=\"val\">1.6-2.2غ<\/div><div class=\"lbl\">بروتين / كجم<\/div><\/div>\n        <div class=\"macro-box\"><div class=\"val\">4-6غ<\/div><div class=\"lbl\">كارب / كجم<\/div><\/div>\n        <div class=\"macro-box\"><div class=\"val\">0.8-1غ<\/div><div class=\"lbl\">دهون / كجم<\/div><\/div>\n      <\/div>\n      <h3 class=\"sub\">مصادر بروتين جيدة<\/h3>\n      <ul>\n        <li>صدور دجاج، لحمة بتلو، سمك، بيض كامل<\/li>\n        <li>زبادي يوناني، جبنة قريش، لبن<\/li>\n        <li>بروتين وواي (اختياري لسد الفجوة اليومية)<\/li>\n      <\/ul>\n      <h3 class=\"sub\">مصادر كارب ودهون صحية<\/h3>\n      <ul>\n        <li>أرز، شوفان، بطاطا، خبز أسمر، فاكهة<\/li>\n        <li>زيت زيتون، أفوكادو، مكسرات، طحينة<\/li>\n      <\/ul>\n      <h3 class=\"sub\">نصايح عملية<\/h3>\n      <ul>\n        <li>وزّع البروتين على 3-4 وجبات بدل تركيزه في وجبة واحدة<\/li>\n        <li>اشرب مية كفاية (2.5-3 لتر يوميًا تقريبًا)<\/li>\n        <li>وجبة قبل التمرين بـ 1-2 ساعة تحتوي كارب + بروتين<\/li>\n        <li>وجبة بعد التمرين خلال ساعة تقريبًا لتحسين الاستشفاء<\/li>\n        <li>تابع وزنك أسبوعيًا؛ زيادة 0.25-0.5 كجم بالأسبوع معدل جيد للتضخيم النظيف<\/li>\n      <\/ul>\n      <div class=\"contact-box\">\n        🍎 للاستشارات المخصصة والمتابعة الغذائية التواصل مع:<br>\n        <strong>أخصائي التغذية / أحمد سرحان حامد عبد العاطي<\/strong><br>\n        📞 هاتف / واتساب: <a href=\"tel:01033186879\">01033186879<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/main>\n\n<footer>\n  جميع الحقوق محفوظة © <strong>أحمد سرحان حامد عبد العاطي<\/strong> | <a href=\"tel:01033186879\" style=\"color:#8b949e;text-decoration:underline\">01033186879<\/a>\n<\/footer>\n\n<script>\nwindow.onerror = function (m, s, l) {\n  var d = document.createElement('div');\n  d.style.cssText = 'background:#da3633;color:#fff;padding:10px;font-size:13px;direction:ltr;text-align:left;word-break:break-all';\n  d.textContent = 'JS error: ' + m + ' (line ' + l + ')';\n  document.body.insertBefore(d, document.body.firstChild);\n};\n<\/script>\n<script>\n// ---------- التخزين (آمن مع try/catch) ----------\nconst storage = {\n  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },\n  set: (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },\n  del: k => { try { localStorage.removeItem(k); } catch (e) {} }\n};\nconst session = {\n  get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } },\n  set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} },\n  del: k => { try { sessionStorage.removeItem(k); } catch (e) {} }\n};\nconst readJSON = (k, fb) => { try { const v = storage.get(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };\nconst esc = s => String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n\n// ---------- بيانات التمارين ----------\nconst defaultWorkoutData = {\n  day1: { label: \"اليوم 1: صدر وباي\", exercises: [\n    { name: \"بنش برس بالبار (Bench Press)\", meta: \"4 مجموعات × 8-10 تكرارات | الراحة: 90 ثانية\", tip: \"ركز على النزول البطيء والدفع الانفجاري.\", sets: 4 },\n    { name: \"بنش برس مائل بالدمبل (Incline DB Press)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 75 ثانية\", tip: \"يستهدف الجزء العلوي من الصدر.\", sets: 3 },\n    { name: \"كروس أوفر بالكابل (Cable Crossover)\", meta: \"3 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"اعصر الصدر في نهاية الحركة.\", sets: 3 },\n    { name: \"تبادل بايسبس بالدمبلز (Bicep Curls)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 60 ثانية\", tip: \"اعزل العضلة وتجنب أرجحة الجسد.\", sets: 3 },\n    { name: \"هامر كيرل (Hammer Curl)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 60 ثانية\", tip: \"يستهدف العضلة العضدية الجانبية.\", sets: 3 } ] },\n  day2: { label: \"اليوم 2: ظهر وتراي\", exercises: [\n    { name: \"سحب ظهر علوي (Lat Pulldown)\", meta: \"4 مجموعات × 10 تكرارات | الراحة: 90 ثانية\", tip: \"اسحب لأسفل بمرفقين مش بإيدين بس.\", sets: 4 },\n    { name: \"تجديف بالبار (Barbell Row)\", meta: \"4 مجموعات × 8-10 تكرارات | الراحة: 90 ثانية\", tip: \"حافظ على استقامة الظهر طول الحركة.\", sets: 4 },\n    { name: \"تجديف كابل جالس (Seated Cable Row)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 75 ثانية\", tip: \"اعصر لوح الكتف عند نهاية السحب.\", sets: 3 },\n    { name: \"دفع تراي بالكابل (Tricep Pushdown)\", meta: \"3 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"ثبّت المرفقين بجانب الجسم.\", sets: 3 },\n    { name: \"سكال كراشر (Skull Crusher)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 60 ثانية\", tip: \"تحكم في النزول لتجنب إصابة الكوع.\", sets: 3 } ] },\n  day3: { label: \"اليوم 3: أكتاف\", exercises: [\n    { name: \"ضغط أكتاف بالدمبل (Overhead Press)\", meta: \"4 مجموعات × 8-10 تكرارات | الراحة: 90 ثانية\", tip: \"تجنب القوس الزائد في أسفل الظهر.\", sets: 4 },\n    { name: \"رفرفة جانبية (Lateral Raise)\", meta: \"4 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"ارفع لمستوى الكتف مش أعلى.\", sets: 4 },\n    { name: \"رفرفة خلفية (Rear Delt Fly)\", meta: \"3 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"يستهدف الجزء الخلفي من الكتف.\", sets: 3 },\n    { name: \"شراج بالبار (Barbell Shrug)\", meta: \"3 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"ارفع الكتفين لفوق مباشرة من غير لف.\", sets: 3 } ] },\n  day4: { label: \"اليوم 4: أرجل\", exercises: [\n    { name: \"سكوات بالبار (Barbell Squat)\", meta: \"4 مجموعات × 8-10 تكرارات | الراحة: 120 ثانية\", tip: \"الركبة في اتجاه أصابع القدم طول الحركة.\", sets: 4 },\n    { name: \"ليج برس (Leg Press)\", meta: \"4 مجموعات × 10-12 تكرار | الراحة: 90 ثانية\", tip: \"متفتحش الركبة بالكامل في القمة.\", sets: 4 },\n    { name: \"رومانيان ديدليفت (Romanian Deadlift)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 90 ثانية\", tip: \"حس بشد الهامسترنج مش الظهر.\", sets: 3 },\n    { name: \"ليج كيرل (Leg Curl)\", meta: \"3 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"حركة بطيئة ومتحكم فيها.\", sets: 3 },\n    { name: \"رفع أصابع القدم (Calf Raise)\", meta: \"4 مجموعات × 15-20 تكرار | الراحة: 45 ثانية\", tip: \"وقف لحظة في أعلى الحركة.\", sets: 4 } ] }\n};\n\nfunction loadWorkoutData() {\n  const d = readJSON('workout_custom_data', null);\n  if (d && typeof d === 'object') {\n    for (const id of Object.keys(defaultWorkoutData)) if (!d[id] || !Array.isArray(d[id].exercises)) return JSON.parse(JSON.stringify(defaultWorkoutData));\n    return d;\n  }\n  return JSON.parse(JSON.stringify(defaultWorkoutData));\n}\nconst saveWorkoutData = d => storage.set('workout_custom_data', JSON.stringify(d));\nconst loadSets = id => readJSON('sets_' + id, {});\nconst saveSets = (id, s) => storage.set('sets_' + id, JSON.stringify(s));\n\n// ---------- التابات ----------\nfunction switchTab(id, btn) {\n  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));\n  if (btn) btn.classList.add('active');\n  document.querySelectorAll('.workout-content,.page-content').forEach(p => p.classList.remove('active'));\n  const el = document.getElementById(id);\n  if (el) el.classList.add('active');\n  if (id === 'progress') renderHistory();\n}\n\n// ---------- عرض الأيام ----------\nfunction renderDays() {\n  const data = loadWorkoutData(), admin = isAdmin();\n  const cur = document.querySelector('.workout-content.active, .page-content.active');\n  const activeId = cur ? cur.id : 'day1';\n  const box = document.getElementById('days-container');\n  let html = '';\n  Object.keys(data).forEach(id => {\n    const d = data[id], st = loadSets(id);\n    html += `<div id=\"${id}\" class=\"workout-content\">\n      <div class=\"daily-progress-container\">\n        <div style=\"display:flex;justify-content:space-between;font-size:.85rem\"><span>${esc(d.label)}<\/span><span id=\"pct-${id}\">0%<\/span><\/div>\n        <div class=\"progress-bar-bg\"><div class=\"progress-bar-fill\" id=\"bar-${id}\"><\/div><\/div>\n      <\/div>`;\n    if (admin) html += `<div class=\"admin-tools\"><button class=\"green-btn\" onclick=\"addExercise('${id}')\">➕ إضافة تمرين<\/button><button class=\"green-btn\" style=\"background:#1f6feb\" onclick=\"changePin()\">🔑 تغيير الرقم السري<\/button><button class=\"green-btn\" style=\"background:#da3633\" onclick=\"resetWorkoutData()\">♻️ استعادة البرنامج الأصلي<\/button><\/div>`;\n    d.exercises.forEach((ex, i) => {\n      html += `<div class=\"ex\"><h3>${esc(ex.name)}<\/h3><div class=\"meta\">${esc(ex.meta || '')}<\/div>${ex.tip ? `<div class=\"tip\">💡 ${esc(ex.tip)}<\/div>` : ''}<div class=\"sets-grid\">`;\n      for (let j = 0; j < ex.sets; j++) {\n        const done = st[i] && st[i][j];\n        html += `<button class=\"set-btn${done ? ' done' : ''}\" onclick=\"toggleSet('${id}',${i},${j})\">${done ? '✔ ' : ''}مجموعة ${j + 1}<\/button>`;\n      }\n      html += '<\/div>';\n      if (admin) html += `<div class=\"admin-bar\"><button class=\"set-btn\" onclick=\"editExercise('${id}',${i})\">✏️ تعديل<\/button><button class=\"set-btn\" style=\"color:#f85149\" onclick=\"deleteExercise('${id}',${i})\">🗑️ حذف<\/button><\/div>`;\n      html += '<\/div>';\n    });\n    html += `<div class=\"save-btn-wrap\"><button class=\"reset-btn\" onclick=\"resetDay('${id}')\">↺ تصفير اليوم<\/button><button class=\"save-btn\" onclick=\"saveSession('${id}')\">💾 حفظ الجلسة<\/button><div class=\"save-note\" id=\"note-${id}\"><\/div><\/div><\/div>`;\n  });\n  box.innerHTML = html;\n  Object.keys(data).forEach(updateProgress);\n  const adminBtn = document.getElementById('adminBtn');\n  adminBtn.classList.toggle('on', admin);\n  adminBtn.textContent = admin ? '🔓 إنهاء وضع المدير' : '⚙️ وضع المدير';\n  if (document.getElementById(activeId)) document.getElementById(activeId).classList.add('active');\n  else if (!document.querySelector('.page-content.active')) {\n    document.getElementById('day1').classList.add('active');\n  }\n}\n\nfunction updateProgress(id) {\n  const d = loadWorkoutData()[id]; if (!d) return;\n  const st = loadSets(id);\n  let total = 0, done = 0;\n  d.exercises.forEach((ex, i) => { total += ex.sets; for (let j = 0; j < ex.sets; j++) if (st[i] && st[i][j]) done++; });\n  const pct = total ? Math.round(done / total * 100) : 0;\n  const bar = document.getElementById('bar-' + id), lbl = document.getElementById('pct-' + id);\n  if (bar) bar.style.width = pct + '%';\n  if (lbl) lbl.textContent = pct + '%';\n  return pct;\n}\n\nfunction toggleSet(id, i, j) {\n  const st = loadSets(id);\n  if (!st[i]) st[i] = [];\n  st[i][j] = !st[i][j];\n  saveSets(id, st);\n  renderDays();\n}\n\nfunction resetDay(id) {\n  if (!confirm('تصفير مجموعات هذا اليوم؟')) return;\n  storage.del('sets_' + id);\n  renderDays();\n}\n\n// ---------- سجل الجلسات ----------\nfunction saveSession(id) {\n  const pct = updateProgress(id) || 0;\n  const note = document.getElementById('note-' + id);\n  if (pct === 0) { if (note) { note.style.color = '#f85149'; note.textContent = 'سجّل مجموعة واحدة على الأقل أولاً.'; } return; }\n  const hist = readJSON('workout_history', []);\n  hist.unshift({ label: loadWorkoutData()[id].label, date: new Date().toLocaleDateString('ar-EG'), pct });\n  storage.set('workout_history', JSON.stringify(hist.slice(0, 100)));\n  if (note) { note.style.color = '#3fb950'; note.textContent = '✅ تم حفظ الجلسة في سجل التقدم'; }\n  renderHistory();\n}\n\nfunction renderHistory() {\n  const hist = readJSON('workout_history', []);\n  document.getElementById('stat-sessions').textContent = hist.length;\n  document.getElementById('stat-streak').textContent = hist.filter(h => h.pct >= 100).length;\n  document.getElementById('stat-avg').textContent = (hist.length ? Math.round(hist.reduce((s, h) => s + h.pct, 0) / hist.length) : 0) + '%';\n  document.getElementById('history-container').innerHTML = hist.length\n    ? hist.map(h => `<div class=\"history-item\"><div class=\"history-title\">${esc(h.label)}<small>${esc(h.date)}<\/small><\/div><div class=\"history-pct\">${h.pct}%<\/div><\/div>`).join('')\n    : '<div class=\"empty\">لا توجد جلسات بعد. أكمل تمرينك واضغط «حفظ الجلسة».<\/div>';\n}\n\nfunction clearHistory() {\n  if (!confirm('مسح سجل التقدم بالكامل؟')) return;\n  storage.del('workout_history');\n  renderHistory();\n}\n\n// ---------- وضع المدير ----------\nconst isAdmin = () => session.get('admin_active') === '1';\n\nfunction toggleAdmin() {\n  if (isAdmin()) { session.del('admin_active'); renderDays(); return; }\n  const pin = storage.get('admin_pin') || '1234';\n  const input = prompt('أدخل الرقم السري لدخول وضع المدير:');\n  if (input === null) return;\n  if (input === pin) { session.set('admin_active', '1'); renderDays(); }\n  else alert('الرقم السري غير صحيح!');\n}\n\nfunction changePin() {\n  const p = prompt('أدخل الرقم السري الجديد (أرقام فقط، 4 خانات على الأقل):');\n  if (p === null) return;\n  if (!/^\\d{4,}$/.test(p)) { alert('الرقم السري لازم يكون أرقام فقط و4 خانات على الأقل.'); return; }\n  storage.set('admin_pin', p);\n  alert('تم تغيير الرقم السري بنجاح.');\n}\n\nfunction resetWorkoutData() {\n  if (!confirm('هل أنت متأكد من استعادة البرنامج الأصلي؟ سيتم مسح كل التعديلات.')) return;\n  storage.del('workout_custom_data');\n  Object.keys(defaultWorkoutData).forEach(id => storage.del('sets_' + id));\n  renderDays();\n}\n\nfunction askSets(def) {\n  let n = parseInt(prompt('عدد المجموعات (من 1 إلى 4):', def), 10);\n  if (isNaN(n) || n < 1) n = def;\n  return Math.min(n, 4);\n}\n\nfunction addExercise(dayId) {\n  const data = loadWorkoutData();\n  const name = prompt('اسم التمرين الجديد:');\n  if (!name || !name.trim()) return;\n  const meta = prompt('التفاصيل (مجموعات × تكرارات | الراحة):', '3 مجموعات × 10-12 تكرار | الراحة: 60 ثانية') || '';\n  const tip = prompt('ملاحظة سريعة (اختياري):', '') || '';\n  data[dayId].exercises.push({ name: name.trim(), meta, tip, sets: askSets(3) });\n  saveWorkoutData(data);\n  renderDays();\n}\n\nfunction editExercise(dayId, i) {\n  const data = loadWorkoutData(), ex = data[dayId].exercises[i];\n  if (!ex) return;\n  const name = prompt('اسم التمرين:', ex.name);\n  if (name === null) return;\n  const meta = prompt('التفاصيل:', ex.meta);\n  const tip = prompt('الملاحظة:', ex.tip);\n  ex.name = name.trim() || ex.name;\n  if (meta !== null) ex.meta = meta;\n  if (tip !== null) ex.tip = tip;\n  ex.sets = askSets(ex.sets);\n  saveWorkoutData(data);\n  renderDays();\n}\n\nfunction deleteExercise(dayId, i) {\n  const data = loadWorkoutData();\n  if (!data[dayId].exercises[i] || !confirm('حذف هذا التمرين؟')) return;\n  data[dayId].exercises.splice(i, 1);\n  saveWorkoutData(data);\n  const st = loadSets(dayId);\n  const arr = Object.keys(st).map(Number).sort((a, b) => a - b);\n  const next = {};\n  arr.forEach(k => { if (k < i) next[k] = st[k]; else if (k > i) next[k - 1] = st[k]; });\n  saveSets(dayId, next);\n  renderDays();\n}\n\n// ---------- حاسبة التغذية ----------\nfunction generateDietPlan() {\n  const age = +document.getElementById('age').value, w = +document.getElementById('weight').value, h = +document.getElementById('height').value;\n  const male = document.getElementById('gender').value === 'male', act = +document.getElementById('activity').value;\n  if (!(age >= 12 && age <= 80 && w >= 30 && w <= 200 && h >= 100 && h <= 230)) { alert('من فضلك أدخل السن والوزن والطول بقيم صحيحة.'); return; }\n  const bmr = 10 * w + 6.25 * h - 5 * age + (male ? 5 : -161);\n  const cals = Math.round(bmr * act + 300);\n  const protein = Math.round(w * 2), fats = Math.round(w), carbs = Math.max(0, Math.round((cals - protein * 4 - fats * 9) / 4));\n  document.getElementById('res-cals').textContent = cals;\n  document.getElementById('res-protein').textContent = protein + 'g';\n  document.getElementById('res-carbs').textContent = carbs + 'g';\n  document.getElementById('res-fats').textContent = fats + 'g';\n  const meals = [['🍳 الفطار', .25, 'بيض + شوفان + فاكهة'], ['🍌 وجبة قبل التمرين', .2, 'أرز أو بطاطا + صدر دجاج'], ['🥤 وجبة بعد التمرين', .25, 'أرز + لحم أو سمك + خضار'], ['🍽️ العشاء', .2, 'دجاج أو سمك + سلطة + زيت زيتون'], ['🥜 سناك', .1, 'زبادي يوناني + مكسرات']];\n  document.getElementById('meal-plan-list').innerHTML = meals.map(m =>\n    `<li><strong>${m[0]}<\/strong>: ${m[2]} — حوالي ${Math.round(cals * m[1])} سعرة و${Math.round(protein * m[1])}g بروتين<\/li>`).join('');\n  document.getElementById('diet-result').style.display = 'block';\n}\n\n// ---------- تشغيل ----------\nrenderDays();\nrenderHistory();\n<\/script>\n<script>window.addEventListener('load',function(){var b=[].find.call(document.querySelectorAll('.tab'),function(x){return /nutrition/.test(x.getAttribute('onclick')||'')});if(b)switchTab('nutrition',b)});<\/script><\/body>\n<\/html>\n", "3": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<link rel=\"icon\" href=\"data:image/jpeg;base64,/9j/4QE3RXhpZgAATU0AKgAAAAgABgEAAAQAAAABAAAAvQEBAAQAAAABAAAAw4dpAAQAAAABAAAAagESAAMAAAABAAAAAAEyAAIAAAAUAAAAVoglAAQAAAABAAAAyAAAAAAyMDI2OjEwOjA1IDA3OjU2OjE1AAAEkAMAAgAAABQAAACgkpEAAgAAAAQ5MDcAkAQAAgAAABQAAAC0kggABAAAAAEAAAAAAAAAADIwMjY6MTA6MDUgMDc6NTY6MTUAMjAyNjoxMDowNSAwNzo1NjoxNQAAAgAHAAUAAAADAAAA5gAdAAIAAAALAAAA/gAAAAAAAAAHAAAAAQAAADgAAAABAAAADwAAAAEyMDI2OjEwOjA1AAABATIAAgAAABQAAAE ex-direction:column}\nheader{background:linear-gradient(135deg,#1f6feb11,#1f6feb33);padding:20px 16px;text-align:center;border-bottom:1px solid #30363d}\nheader h1{font-size:1.4rem;color:#58a6ff;margin-bottom:4px}\nheader p{color:#8b949e;font-size:.85rem}\n.owner-badge{display:inline-block;background:rgba(31,111,235,.15);color:#58a6ff;border:1px solid #1f6feb44;border-radius:20px;padding:4px 14px;font-size:.75rem;margin-top:8px;font-weight:bold}\n.admin-btn{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:6px 16px;border-radius:6px;font-size:.8rem;margin-top:10px;cursor:pointer}\n.admin-btn.on{border-color:#d2a8ff;color:#d2a8ff}\n.pwa-install-btn{display:none;background:#238636;color:#fff;border:none;padding:6px 16px;border-radius:6px;font-weight:bold;font-size:.8rem;margin-top:10px;cursor:pointer}\n.tabs{display:flex;overflow-x:auto;background:#161b22;position:sticky;top:0;z-index:10;border-bottom:1px solid #30363d}\n.tab{flex:0 0 auto;padding:12px 16px;text-align:center;cursor:pointer;border:none;background:none;color:#8b949e;font-size:.85rem;font-weight:bold;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}\n.tab.active{color:#58a6ff;border-bottom-color:#58a6ff;background:#0d1117}\nmain{max-width:600px;margin:0 auto;padding:16px;flex:1;width:100%}\n.workout-content,.page-content{display:none}\n.workout-content.active,.page-content.active{display:block}\n.ex{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;margin-bottom:12px}\n.ex h3{font-size:1rem;color:#f0f6fc;margin-bottom:2px}\n.meta{color:#8b949e;font-size:.78rem;margin-bottom:8px}\n.tip{color:#d2a8ff;font-size:.78rem;font-style:italic;margin-bottom:12px}\n.sets-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}\n.set-btn{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:10px 4px;border-radius:6px;font-size:.8rem;cursor:pointer;font-weight:500;text-align:center;transition:all .2s}\n.set-btn.done{background:#238636;border-color:#2ea043;color:#fff}\n.daily-progress-container{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px;margin-bottom:16px}\n.progress-bar-bg{background:#21262d;height:10px;border-radius:5px;overflow:hidden;margin-top:6px}\n.progress-bar-fill{background:#238636;height:100%;width:0%;transition:width .3s ease}\n.save-btn-wrap{margin:16px 0;text-align:center}\n.save-btn{background:#1f6feb;color:#fff;border:none;border-radius:8px;padding:12px 20px;font-size:.88rem;font-weight:bold;cursor:pointer}\n.reset-btn{background:#21262d;color:#f85149;border:1px solid #30363d;border-radius:8px;padding:12px 16px;font-size:.88rem;font-weight:bold;cursor:pointer;margin-left:8px}\n.green-btn{background:#238636;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:.85rem;font-weight:bold;cursor:pointer;margin:4px}\n.save-note{color:#3fb950;font-size:.85rem;margin-top:10px;text-align:center;font-weight:bold;min-height:1.2em}\n.progress-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px;margin-bottom:14px}\n.progress-card h2{font-size:1.1rem;color:#58a6ff}\n.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}\n.stat-box{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:14px 6px;text-align:center}\n.stat-val{font-size:1.4rem;font-weight:bold;color:#58a6ff}\n.stat-lbl{font-size:.72rem;color:#8b949e;margin-top:4px}\n.history-list{display:flex;flex-direction:column;gap:10px}\n.history-item{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}\n.history-title{font-size:.88rem;color:#f0f6fc}\n.history-title small{display:block;color:#8b949e;font-size:.72rem}\n.history-pct{font-size:.9rem;font-weight:bold;color:#3fb950}\n.empty{color:#8b949e;font-size:.85rem;text-align:center;padding:10px}\n.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px;margin-bottom:12px}\n.card h2{font-size:1.05rem;color:#58a6ff;margin-bottom:10px}\n.card h3.sub{font-size:.9rem;color:#f0f6fc;margin:14px 0 6px}\n.card p,.card li{font-size:.82rem;color:#c9d1d9;line-height:1.7}\n.card ul{padding-right:18px;margin-bottom:6px}\n.macro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}\n.macro-box{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px;text-align:center}\n.macro-box .val{color:#d2a8ff;font-weight:bold;font-size:.95rem}\n.macro-box .lbl{color:#8b949e;font-size:.72rem;margin-top:2px}\n.diet-form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}\n.form-group{display:flex;flex-direction:column}\n.form-group.full{grid-column:span 2}\n.form-group label{font-size:.78rem;color:#8b949e;margin-bottom:4px}\n.form-group input,.form-group select{background:#0d1117;border:1px solid #30363d;color:#f0f6fc;padding:8px;border-radius:6px;font-size:.85rem;outline:none}\n.calc-btn{grid-column:span 2;background:#238636;color:#fff;border:none;padding:10px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:.85rem;margin-top:6px}\n.diet-result{margin-top:14px;background:#0d1117;border:1px solid #1f6feb;border-radius:8px;padding:12px;display:none}\n.diet-result h4{color:#58a6ff;font-size:.9rem;margin-bottom:8px}\n.admin-bar{display:flex;gap:6px;margin-top:8px}\n.admin-bar .set-btn{flex:1}\n.admin-tools{text-align:center;border:1px dashed #d2a8ff;border-radius:12px;padding:10px;margin-bottom:12px}\n.contact-box{background:#0d1117;border:1px solid #1f6feb;border-radius:8px;padding:12px;margin-top:14px;text-align:center;color:#58a6ff;font-size:.85rem;line-height:1.6}\n.contact-box a{color:#58a6ff;text-decoration:none;font-weight:bold}\nfooter{background:#161b22;border-top:1px solid #30363d;padding:16px;text-align:center;font-size:.78rem;color:#8b949e;margin-top:auto}\nfooter strong{color:#c9d1d9}\n<\/style>\n<\/head>\n<body>\n\n<header>\n  <h1>🏋️‍♂️ برنامج التضخيم العضلي المكثف<\/h1>\n  <p>4 أيام في الأسبوع - تركيز على الحجم والأوزان<\/p>\n  <div class=\"owner-badge\">👑 إعداد وتطوير: أحمد سرحان حامد عبد العاطي<\/div><br>\n  <button class=\"admin-btn\" id=\"adminBtn\" onclick=\"toggleAdmin()\">⚙️ وضع المدير<\/button>\n<\/header>\n\n<div class=\"tabs\">\n  <button class=\"tab active\" onclick=\"switchTab('day1',this)\">💪 اليوم 1: صدر وباي<\/button>\n  <button class=\"tab\" onclick=\"switchTab('day2',this)\">🔥 اليوم 2: ظهر وتراي<\/button>\n  <button class=\"tab\" onclick=\"switchTab('day3',this)\">⚡ اليوم 3: أكتاف<\/button>\n  <button class=\"tab\" onclick=\"switchTab('day4',this)\">🦵 اليوم 4: أرجل<\/button>\n  <button class=\"tab\" onclick=\"switchTab('progress',this)\">📊 التقدم<\/button>\n  <button class=\"tab\" onclick=\"switchTab('nutrition',this)\">🥗 التغذية<\/button>\n<\/div>\n\n<main>\n  <div id=\"days-container\"><\/div>\n\n  <div id=\"progress\" class=\"page-content\">\n    <div class=\"progress-card\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:16px\">\n        <h2>📈 سجل إنجازاتك وتقدمك<\/h2>\n        <button onclick=\"clearHistory()\" style=\"background:none;border:none;color:#f85149;font-size:.75rem;cursor:pointer\">مسح السجل<\/button>\n      <\/div>\n      <div class=\"stats-grid\">\n        <div class=\"stat-box\"><div class=\"stat-val\" id=\"stat-sessions\">0<\/div><div class=\"stat-lbl\">جلسات مسجلة<\/div><\/div>\n        <div class=\"stat-box\"><div class=\"stat-val\" id=\"stat-streak\">0<\/div><div class=\"stat-lbl\">أيام مكتملة<\/div><\/div>\n        <div class=\"stat-box\"><div class=\"stat-val\" id=\"stat-avg\">0%<\/div><div class=\"stat-lbl\">متوسط الإنجاز<\/div><\/div>\n      <\/div>\n      <div class=\"history-list\" id=\"history-container\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"nutrition\" class=\"page-content\">\n    <div class=\"card\">\n      <h2>📊 حاسبة التغذية ومولد نظام التضخيم<\/h2>\n      <p>أدخل بياناتك لحساب الاحتياج اليومي من السعرات والماكروز واستخراج اقتراح وجبات مخصص.<\/p>\n      <div class=\"diet-form\">\n        <div class=\"form-group\"><label>السن (سنة)<\/label><input type=\"number\" id=\"age\" placeholder=\"مثال: 25\" min=\"12\" max=\"80\"><\/div>\n        <div class=\"form-group\"><label>الوزن (كجم)<\/label><input type=\"number\" id=\"weight\" placeholder=\"مثال: 75\" min=\"30\" max=\"200\"><\/div>\n        <div class=\"form-group\"><label>الطول (سم)<\/label><input type=\"number\" id=\"height\" placeholder=\"مثال: 175\" min=\"100\" max=\"230\"><\/div>\n        <div class=\"form-group\"><label>النوع<\/label><select id=\"gender\"><option value=\"male\">ذكر<\/option><option value=\"female\">أنثى<\/option><\/select><\/div>\n        <div class=\"form-group full\"><label>مستوى النشاط البدني<\/label>\n          <select id=\"activity\">\n            <option value=\"1.375\">خفيف إلى متوسط (3-4 أيام تمرين)<\/option>\n            <option value=\"1.55\" selected>عالي (4-5 أيام تمرين مكثف)<\/option>\n            <option value=\"1.725\">رياضي قوي (6 أيام تمرين مكثف)<\/option>\n          <\/select>\n        <\/div>\n        <button class=\"calc-btn\" onclick=\"generateDietPlan()\">🧮 تصميم النظام الغذائي<\/button>\n      <\/div>\n      <div id=\"diet-result\" class=\"diet-result\">\n        <h4>🎯 النتائج المستهدفة لتضخيم نظيف:<\/h4>\n        <div class=\"macro-grid\">\n          <div class=\"macro-box\"><div class=\"val\" id=\"res-cals\">0<\/div><div class=\"lbl\">سعرة / يوم<\/div><\/div>\n          <div class=\"macro-box\"><div class=\"val\" id=\"res-protein\">0g<\/div><div class=\"lbl\">بروتين<\/div><\/div>\n          <div class=\"macro-box\"><div class=\"val\" id=\"res-carbs\">0g<\/div><div class=\"lbl\">كاربوهيدرات<\/div><\/div>\n        <\/div>\n        <div style=\"text-align:center;margin-bottom:10px\">\n          <small style=\"color:#8b949e\">الدهون الصحية المطلوبة: <strong id=\"res-fats\" style=\"color:#d2a8ff\">0g<\/strong> يومياً<\/small>\n        <\/div>\n        <h3 class=\"sub\">🍽️ مقترح توزيع الوجبات اليومي:<\/h3>\n        <ul id=\"meal-plan-list\"><\/ul>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>🥗 أساسيات التغذية لمرحلة التضخيم<\/h2>\n      <p>عشان تكسب عضل بجودة عالية من غير دهون زيادة كتير، ركّز على 3 محاور: فائض سعرات معتدل، بروتين كافي، وانتظام في المواعيد.<\/p>\n      <h3 class=\"sub\">توزيع تقريبي للماكروز (لكل كيلوجرام من وزن الجسم)<\/h3>\n      <div class=\"macro-grid\">\n        <div class=\"macro-box\"><div class=\"val\">1.6-2.2غ<\/div><div class=\"lbl\">بروتين / كجم<\/div><\/div>\n        <div class=\"macro-box\"><div class=\"val\">4-6غ<\/div><div class=\"lbl\">كارب / كجم<\/div><\/div>\n        <div class=\"macro-box\"><div class=\"val\">0.8-1غ<\/div><div class=\"lbl\">دهون / كجم<\/div><\/div>\n      <\/div>\n      <h3 class=\"sub\">مصادر بروتين جيدة<\/h3>\n      <ul>\n        <li>صدور دجاج، لحمة بتلو، سمك، بيض كامل<\/li>\n        <li>زبادي يوناني، جبنة قريش، لبن<\/li>\n        <li>بروتين وواي (اختياري لسد الفجوة اليومية)<\/li>\n      <\/ul>\n      <h3 class=\"sub\">مصادر كارب ودهون صحية<\/h3>\n      <ul>\n        <li>أرز، شوفان، بطاطا، خبز أسمر، فاكهة<\/li>\n        <li>زيت زيتون، أفوكادو، مكسرات، طحينة<\/li>\n      <\/ul>\n      <h3 class=\"sub\">نصايح عملية<\/h3>\n      <ul>\n        <li>وزّع البروتين على 3-4 وجبات بدل تركيزه في وجبة واحدة<\/li>\n        <li>اشرب مية كفاية (2.5-3 لتر يوميًا تقريبًا)<\/li>\n        <li>وجبة قبل التمرين بـ 1-2 ساعة تحتوي كارب + بروتين<\/li>\n        <li>وجبة بعد التمرين خلال ساعة تقريبًا لتحسين الاستشفاء<\/li>\n        <li>تابع وزنك أسبوعيًا؛ زيادة 0.25-0.5 كجم بالأسبوع معدل جيد للتضخيم النظيف<\/li>\n      <\/ul>\n      <div class=\"contact-box\">\n        🍎 للاستشارات المخصصة والمتابعة الغذائية التواصل مع:<br>\n        <strong>أخصائي التغذية / أحمد سرحان حامد عبد العاطي<\/strong><br>\n        📞 هاتف / واتساب: <a href=\"tel:01033186879\">01033186879<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/main>\n\n<footer>\n  جميع الحقوق محفوظة © <strong>أحمد سرحان حامد عبد العاطي<\/strong> | <a href=\"tel:01033186879\" style=\"color:#8b949e;text-decoration:underline\">01033186879<\/a>\n<\/footer>\n\n<script>\nwindow.onerror = function (m, s, l) {\n  var d = document.createElement('div');\n  d.style.cssText = 'background:#da3633;color:#fff;padding:10px;font-size:13px;direction:ltr;text-align:left;word-break:break-all';\n  d.textContent = 'JS error: ' + m + ' (line ' + l + ')';\n  document.body.insertBefore(d, document.body.firstChild);\n};\n<\/script>\n<script>\n// ---------- التخزين (آمن مع try/catch) ----------\nconst storage = {\n  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },\n  set: (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },\n  del: k => { try { localStorage.removeItem(k); } catch (e) {} }\n};\nconst session = {\n  get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } },\n  set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} },\n  del: k => { try { sessionStorage.removeItem(k); } catch (e) {} }\n};\nconst readJSON = (k, fb) => { try { const v = storage.get(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };\nconst esc = s => String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n\n// ---------- بيانات التمارين ----------\nconst defaultWorkoutData = {\n  day1: { label: \"اليوم 1: صدر وباي\", exercises: [\n    { name: \"بنش برس بالبار (Bench Press)\", meta: \"4 مجموعات × 8-10 تكرارات | الراحة: 90 ثانية\", tip: \"ركز على النزول البطيء والدفع الانفجاري.\", sets: 4 },\n    { name: \"بنش برس مائل بالدمبل (Incline DB Press)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 75 ثانية\", tip: \"يستهدف الجزء العلوي من الصدر.\", sets: 3 },\n    { name: \"كروس أوفر بالكابل (Cable Crossover)\", meta: \"3 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"اعصر الصدر في نهاية الحركة.\", sets: 3 },\n    { name: \"تبادل بايسبس بالدمبلز (Bicep Curls)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 60 ثانية\", tip: \"اعزل العضلة وتجنب أرجحة الجسد.\", sets: 3 },\n    { name: \"هامر كيرل (Hammer Curl)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 60 ثانية\", tip: \"يستهدف العضلة العضدية الجانبية.\", sets: 3 } ] },\n  day2: { label: \"اليوم 2: ظهر وتراي\", exercises: [\n    { name: \"سحب ظهر علوي (Lat Pulldown)\", meta: \"4 مجموعات × 10 تكرارات | الراحة: 90 ثانية\", tip: \"اسحب لأسفل بمرفقين مش بإيدين بس.\", sets: 4 },\n    { name: \"تجديف بالبار (Barbell Row)\", meta: \"4 مجموعات × 8-10 تكرارات | الراحة: 90 ثانية\", tip: \"حافظ على استقامة الظهر طول الحركة.\", sets: 4 },\n    { name: \"تجديف كابل جالس (Seated Cable Row)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 75 ثانية\", tip: \"اعصر لوح الكتف عند نهاية السحب.\", sets: 3 },\n    { name: \"دفع تراي بالكابل (Tricep Pushdown)\", meta: \"3 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"ثبّت المرفقين بجانب الجسم.\", sets: 3 },\n    { name: \"سكال كراشر (Skull Crusher)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 60 ثانية\", tip: \"تحكم في النزول لتجنب إصابة الكوع.\", sets: 3 } ] },\n  day3: { label: \"اليوم 3: أكتاف\", exercises: [\n    { name: \"ضغط أكتاف بالدمبل (Overhead Press)\", meta: \"4 مجموعات × 8-10 تكرارات | الراحة: 90 ثانية\", tip: \"تجنب القوس الزائد في أسفل الظهر.\", sets: 4 },\n    { name: \"رفرفة جانبية (Lateral Raise)\", meta: \"4 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"ارفع لمستوى الكتف مش أعلى.\", sets: 4 },\n    { name: \"رفرفة خلفية (Rear Delt Fly)\", meta: \"3 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"يستهدف الجزء الخلفي من الكتف.\", sets: 3 },\n    { name: \"شراج بالبار (Barbell Shrug)\", meta: \"3 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"ارفع الكتفين لفوق مباشرة من غير لف.\", sets: 3 } ] },\n  day4: { label: \"اليوم 4: أرجل\", exercises: [\n    { name: \"سكوات بالبار (Barbell Squat)\", meta: \"4 مجموعات × 8-10 تكرارات | الراحة: 120 ثانية\", tip: \"الركبة في اتجاه أصابع القدم طول الحركة.\", sets: 4 },\n    { name: \"ليج برس (Leg Press)\", meta: \"4 مجموعات × 10-12 تكرار | الراحة: 90 ثانية\", tip: \"متفتحش الركبة بالكامل في القمة.\", sets: 4 },\n    { name: \"رومانيان ديدليفت (Romanian Deadlift)\", meta: \"3 مجموعات × 10-12 تكرار | الراحة: 90 ثانية\", tip: \"حس بشد الهامسترنج مش الظهر.\", sets: 3 },\n    { name: \"ليج كيرل (Leg Curl)\", meta: \"3 مجموعات × 12-15 تكرار | الراحة: 60 ثانية\", tip: \"حركة بطيئة ومتحكم فيها.\", sets: 3 },\n    { name: \"رفع أصابع القدم (Calf Raise)\", meta: \"4 مجموعات × 15-20 تكرار | الراحة: 45 ثانية\", tip: \"وقف لحظة في أعلى الحركة.\", sets: 4 } ] }\n};\n\nfunction loadWorkoutData() {\n  const d = readJSON('workout_custom_data', null);\n  if (d && typeof d === 'object') {\n    for (const id of Object.keys(defaultWorkoutData)) if (!d[id] || !Array.isArray(d[id].exercises)) return JSON.parse(JSON.stringify(defaultWorkoutData));\n    return d;\n  }\n  return JSON.parse(JSON.stringify(defaultWorkoutData));\n}\nconst saveWorkoutData = d => storage.set('workout_custom_data', JSON.stringify(d));\nconst loadSets = id => readJSON('sets_' + id, {});\nconst saveSets = (id, s) => storage.set('sets_' + id, JSON.stringify(s));\n\n// ---------- التابات ----------\nfunction switchTab(id, btn) {\n  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));\n  if (btn) btn.classList.add('active');\n  document.querySelectorAll('.workout-content,.page-content').forEach(p => p.classList.remove('active'));\n  const el = document.getElementById(id);\n  if (el) el.classList.add('active');\n  if (id === 'progress') renderHistory();\n}\n\n// ---------- عرض الأيام ----------\nfunction renderDays() {\n  const data = loadWorkoutData(), admin = isAdmin();\n  const cur = document.querySelector('.workout-content.active, .page-content.active');\n  const activeId = cur ? cur.id : 'day1';\n  const box = document.getElementById('days-container');\n  let html = '';\n  Object.keys(data).forEach(id => {\n    const d = data[id], st = loadSets(id);\n    html += `<div id=\"${id}\" class=\"workout-content\">\n      <div class=\"daily-progress-container\">\n        <div style=\"display:flex;justify-content:space-between;font-size:.85rem\"><span>${esc(d.label)}<\/span><span id=\"pct-${id}\">0%<\/span><\/div>\n        <div class=\"progress-bar-bg\"><div class=\"progress-bar-fill\" id=\"bar-${id}\"><\/div><\/div>\n      <\/div>`;\n    if (admin) html += `<div class=\"admin-tools\"><button class=\"green-btn\" onclick=\"addExercise('${id}')\">➕ إضافة تمرين<\/button><button class=\"green-btn\" style=\"background:#1f6feb\" onclick=\"changePin()\">🔑 تغيير الرقم السري<\/button><button class=\"green-btn\" style=\"background:#da3633\" onclick=\"resetWorkoutData()\">♻️ استعادة البرنامج الأصلي<\/button><\/div>`;\n    d.exercises.forEach((ex, i) => {\n      html += `<div class=\"ex\"><h3>${esc(ex.name)}<\/h3><div class=\"meta\">${esc(ex.meta || '')}<\/div>${ex.tip ? `<div class=\"tip\">💡 ${esc(ex.tip)}<\/div>` : ''}<div class=\"sets-grid\">`;\n      for (let j = 0; j < ex.sets; j++) {\n        const done = st[i] && st[i][j];\n        html += `<button class=\"set-btn${done ? ' done' : ''}\" onclick=\"toggleSet('${id}',${i},${j})\">${done ? '✔ ' : ''}مجموعة ${j + 1}<\/button>`;\n      }\n      html += '<\/div>';\n      if (admin) html += `<div class=\"admin-bar\"><button class=\"set-btn\" onclick=\"editExercise('${id}',${i})\">✏️ تعديل<\/button><button class=\"set-btn\" style=\"color:#f85149\" onclick=\"deleteExercise('${id}',${i})\">🗑️ حذف<\/button><\/div>`;\n      html += '<\/div>';\n    });\n    html += `<div class=\"save-btn-wrap\"><button class=\"reset-btn\" onclick=\"resetDay('${id}')\">↺ تصفير اليوم<\/button><button class=\"save-btn\" onclick=\"saveSession('${id}')\">💾 حفظ الجلسة<\/button><div class=\"save-note\" id=\"note-${id}\"><\/div><\/div><\/div>`;\n  });\n  box.innerHTML = html;\n  Object.keys(data).forEach(updateProgress);\n  const adminBtn = document.getElementById('adminBtn');\n  adminBtn.classList.toggle('on', admin);\n  adminBtn.textContent = admin ? '🔓 إنهاء وضع المدير' : '⚙️ وضع المدير';\n  if (document.getElementById(activeId)) document.getElementById(activeId).classList.add('active');\n  else if (!document.querySelector('.page-content.active')) {\n    document.getElementById('day1').classList.add('active');\n  }\n}\n\nfunction updateProgress(id) {\n  const d = loadWorkoutData()[id]; if (!d) return;\n  const st = loadSets(id);\n  let total = 0, done = 0;\n  d.exercises.forEach((ex, i) => { total += ex.sets; for (let j = 0; j < ex.sets; j++) if (st[i] && st[i][j]) done++; });\n  const pct = total ? Math.round(done / total * 100) : 0;\n  const bar = document.getElementById('bar-' + id), lbl = document.getElementById('pct-' + id);\n  if (bar) bar.style.width = pct + '%';\n  if (lbl) lbl.textContent = pct + '%';\n  return pct;\n}\n\nfunction toggleSet(id, i, j) {\n  const st = loadSets(id);\n  if (!st[i]) st[i] = [];\n  st[i][j] = !st[i][j];\n  saveSets(id, st);\n  renderDays();\n}\n\nfunction resetDay(id) {\n  if (!confirm('تصفير مجموعات هذا اليوم؟')) return;\n  storage.del('sets_' + id);\n  renderDays();\n}\n\n// ---------- سجل الجلسات ----------\nfunction saveSession(id) {\n  const pct = updateProgress(id) || 0;\n  const note = document.getElementById('note-' + id);\n  if (pct === 0) { if (note) { note.style.color = '#f85149'; note.textContent = 'سجّل مجموعة واحدة على الأقل أولاً.'; } return; }\n  const hist = readJSON('workout_history', []);\n  hist.unshift({ label: loadWorkoutData()[id].label, date: new Date().toLocaleDateString('ar-EG'), pct });\n  storage.set('workout_history', JSON.stringify(hist.slice(0, 100)));\n  if (note) { note.style.color = '#3fb950'; note.textContent = '✅ تم حفظ الجلسة في سجل التقدم'; }\n  renderHistory();\n}\n\nfunction renderHistory() {\n  const hist = readJSON('workout_history', []);\n  document.getElementById('stat-sessions').textContent = hist.length;\n  document.getElementById('stat-streak').textContent = hist.filter(h => h.pct >= 100).length;\n  document.getElementById('stat-avg').textContent = (hist.length ? Math.round(hist.reduce((s, h) => s + h.pct, 0) / hist.length) : 0) + '%';\n  document.getElementById('history-container').innerHTML = hist.length\n    ? hist.map(h => `<div class=\"history-item\"><div class=\"history-title\">${esc(h.label)}<small>${esc(h.date)}<\/small><\/div><div class=\"history-pct\">${h.pct}%<\/div><\/div>`).join('')\n    : '<div class=\"empty\">لا توجد جلسات بعد. أكمل تمرينك واضغط «حفظ الجلسة».<\/div>';\n}\n\nfunction clearHistory() {\n  if (!confirm('مسح سجل التقدم بالكامل؟')) return;\n  storage.del('workout_history');\n  renderHistory();\n}\n\n// ---------- وضع المدير ----------\nconst isAdmin = () => session.get('admin_active') === '1';\n\nfunction toggleAdmin() {\n  if (isAdmin()) { session.del('admin_active'); renderDays(); return; }\n  const pin = storage.get('admin_pin') || '1234';\n  const input = prompt('أدخل الرقم السري لدخول وضع المدير:');\n  if (input === null) return;\n  if (input === pin) { session.set('admin_active', '1'); renderDays(); }\n  else alert('الرقم السري غير صحيح!');\n}\n\nfunction changePin() {\n  const p = prompt('أدخل الرقم السري الجديد (أرقام فقط، 4 خانات على الأقل):');\n  if (p === null) return;\n  if (!/^\\d{4,}$/.test(p)) { alert('الرقم السري لازم يكون أرقام فقط و4 خانات على الأقل.'); return; }\n  storage.set('admin_pin', p);\n  alert('تم تغيير الرقم السري بنجاح.');\n}\n\nfunction resetWorkoutData() {\n  if (!confirm('هل أنت متأكد من استعادة البرنامج الأصلي؟ سيتم مسح كل التعديلات.')) return;\n  storage.del('workout_custom_data');\n  Object.keys(defaultWorkoutData).forEach(id => storage.del('sets_' + id));\n  renderDays();\n}\n\nfunction askSets(def) {\n  let n = parseInt(prompt('عدد المجموعات (من 1 إلى 4):', def), 10);\n  if (isNaN(n) || n < 1) n = def;\n  return Math.min(n, 4);\n}\n\nfunction addExercise(dayId) {\n  const data = loadWorkoutData();\n  const name = prompt('اسم التمرين الجديد:');\n  if (!name || !name.trim()) return;\n  const meta = prompt('التفاصيل (مجموعات × تكرارات | الراحة):', '3 مجموعات × 10-12 تكرار | الراحة: 60 ثانية') || '';\n  const tip = prompt('ملاحظة سريعة (اختياري):', '') || '';\n  data[dayId].exercises.push({ name: name.trim(), meta, tip, sets: askSets(3) });\n  saveWorkoutData(data);\n  renderDays();\n}\n\nfunction editExercise(dayId, i) {\n  const data = loadWorkoutData(), ex = data[dayId].exercises[i];\n  if (!ex) return;\n  const name = prompt('اسم التمرين:', ex.name);\n  if (name === null) return;\n  const meta = prompt('التفاصيل:', ex.meta);\n  const tip = prompt('الملاحظة:', ex.tip);\n  ex.name = name.trim() || ex.name;\n  if (meta !== null) ex.meta = meta;\n  if (tip !== null) ex.tip = tip;\n  ex.sets = askSets(ex.sets);\n  saveWorkoutData(data);\n  renderDays();\n}\n\nfunction deleteExercise(dayId, i) {\n  const data = loadWorkoutData();\n  if (!data[dayId].exercises[i] || !confirm('حذف هذا التمرين؟')) return;\n  data[dayId].exercises.splice(i, 1);\n  saveWorkoutData(data);\n  const st = loadSets(dayId);\n  const arr = Object.keys(st).map(Number).sort((a, b) => a - b);\n  const next = {};\n  arr.forEach(k => { if (k < i) next[k] = st[k]; else if (k > i) next[k - 1] = st[k]; });\n  saveSets(dayId, next);\n  renderDays();\n}\n\n// ---------- حاسبة التغذية ----------\nfunction generateDietPlan() {\n  const age = +document.getElementById('age').value, w = +document.getElementById('weight').value, h = +document.getElementById('height').value;\n  const male = document.getElementById('gender').value === 'male', act = +document.getElementById('activity').value;\n  if (!(age >= 12 && age <= 80 && w >= 30 && w <= 200 && h >= 100 && h <= 230)) { alert('من فضلك أدخل السن والوزن والطول بقيم صحيحة.'); return; }\n  const bmr = 10 * w + 6.25 * h - 5 * age + (male ? 5 : -161);\n  const cals = Math.round(bmr * act + 300);\n  const protein = Math.round(w * 2), fats = Math.round(w), carbs = Math.max(0, Math.round((cals - protein * 4 - fats * 9) / 4));\n  document.getElementById('res-cals').textContent = cals;\n  document.getElementById('res-protein').textContent = protein + 'g';\n  document.getElementById('res-carbs').textContent = carbs + 'g';\n  document.getElementById('res-fats').textContent = fats + 'g';\n  const meals = [['🍳 الفطار', .25, 'بيض + شوفان + فاكهة'], ['🍌 وجبة قبل التمرين', .2, 'أرز أو بطاطا + صدر دجاج'], ['🥤 وجبة بعد التمرين', .25, 'أرز + لحم أو سمك + خضار'], ['🍽️ العشاء', .2, 'دجاج أو سمك + سلطة + زيت زيتون'], ['🥜 سناك', .1, 'زبادي يوناني + مكسرات']];\n  document.getElementById('meal-plan-list').innerHTML = meals.map(m =>\n    `<li><strong>${m[0]}<\/strong>: ${m[2]} — حوالي ${Math.round(cals * m[1])} سعرة و${Math.round(protein * m[1])}g بروتين<\/li>`).join('');\n  document.getElementById('diet-result').style.display = 'block';\n}\n\n// ---------- تشغيل ----------\nrenderDays();\nrenderHistory();\n<\/script>\n<\/body>\n<\/html>\n", "4": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<link rel=\"icon\" href=\"data:image/jpeg;base64,/9j/4QE3RXhpZgAATU0AKgAAAAgABgEAAAQAAAABAAAAuQEBAAQAAAABAAAAzYdpAAQAAAABAAAAagESAAMAAAABAAAAAAEyAAIAAAAUAAAAVoglAAQAAAABAAAAyAAAAAAyMDI2OjEwOjA1IDA3OjU2OjE1AAAEkAMAAgAAABQAAACgkpEAAgAAAAQ5MDcAkAQAAgAAABQAAAC0kggABAAAAAEAAAAAAAAAADIwMjY6MTA6MDUgMDc6NTY6MTUAMjAyNjoxMDowNSAwNzo1NjoxNQAAAgAHAAUAAAADAAAA5gAdAAIAAAALAAAA/gAAAAAAAAAHAAAAAQAAADgAAAABAAAADwAAAAEyMDI2OjEwOjA1AAABATIAAgAAABQAAAEbAAAAADIwMjY6MTA6MDUgMDc6NTY6MTUA/+AAEEpGSUYAAQEAAAEAAQAA/+ICKElDQ19QUk9GSUxFAAEBAAACGAAAAAACEAAAbW50clJHQiBYWVogAAAAAAAAAAAAAAAAYWNzcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAPbWAAEAAAAA0y0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAJZGVzYwAAAPAAAAB0clhZWgAAAWQAAAAUZ1hZWgAAAXgAAAAUYlhZWgAAAYwAAAAUclRSQwAAAaAAAAAoZ1RSQwAAAaAAAAAoYlRSQwAAAaAAAAAod3RwdAAAAcgAAAAUY3BydAAAAdwAAAA8bWx1YwAAAAAAAAABAAAADGVuVVMAAABYAAAAHABzAFIARwBCAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9wYXJhAAAAAAAEAAAAAmZmAADyp
